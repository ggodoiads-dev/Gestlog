services:
  postgres:
    image: postgres:16-alpine
    container_name: gestlog-postgres
    environment:
      POSTGRES_USER: gestlog
      POSTGRES_PASSWORD: gestlog
      POSTGRES_DB: gestlog
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - gestlog_pg:/var/lib/postgresql/data
      - ./scripts/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestlog -d gestlog"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gestlog-redis
    ports:
      - "6379:6379"
    volumes:
      - gestlog_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    container_name: gestlog-mailhog
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

  minio:
    image: minio/minio:latest
    container_name: gestlog-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gestlog
      MINIO_ROOT_PASSWORD: gestlog-dev-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - gestlog_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  gestlog_pg:
  gestlog_redis:
  gestlog_minio:
